name: QA evaluations

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_ragas:
        description: Run model-judged Ragas scores on synthetic data
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m evals.run

  ragas:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ragas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-service
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
      EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
      EVAL_MODEL: ${{ vars.EVAL_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements-eval.txt
      - run: pip install -r requirements-eval.txt
      - run: python -m evals.run --live-answer --judge --thresholds evals/thresholds-v1.json --output ragas-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-report
          path: ai-service/ragas-report.json
